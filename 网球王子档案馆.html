<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网球王子档案馆</title>
    <style>
        :root {
            --deep-bg: #021024;
            --navy: #052695;
            --steel: #5483B3;
            --sky: #7DA0CA;
            --ice: #C1E8FF;
            --white: #ffffff;
            --text: #1a1a2e;
            --text-light: #3a3a5c;
            --gold: #e8c547;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.10);
            --card-radius: 10px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif;
            background: linear-gradient(180deg, #f0f5fa 0%, #e6eef6 100%);
            color: var(--text);
            line-height: 1.7;
            min-height: 100vh;
        }        /* ========== 顶部导航栏 ========== */
        .top-bar {
            background: var(--deep-bg);
            color: var(--white);
            padding: 0 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
        }
        .top-bar-inner {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 56px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            color: var(--white);
            text-decoration: none;
        }
        .logo-icon {
            font-size: 1.6rem;
        }
        .nav-links {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: var(--ice);
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 6px;
            transition: all 0.25s;
            font-size: 0.9rem;
            white-space: nowrap;
            cursor: pointer;
        }
        .nav-links a:hover,
        .nav-links a.active {
            background: var(--navy);
            color: #fff;
        }

        /* ========== 主布局 ========== */
        .main-wrapper {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            gap: 20px;
            padding: 20px;
        }
        .content-area {
            flex: 1;
            min-width: 0;
        }
        .sidebar {
            width: 280px;
            flex-shrink: 0;
            position: sticky;
            top: 80px;
            align-self: flex-start;
            max-height: calc(100vh - 100px);
            overflow-y: auto;
        }        /* ========== 卡片样式 ========== */
        .card {
            background: var(--white);
            border-radius: var(--card-radius);
            box-shadow: var(--shadow);
            padding: 24px 28px;
            margin-bottom: 20px;
            border-top: 3px solid var(--steel);
        }
        .card h2 {
            font-size: 1.4rem;
            color: var(--navy);
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--ice);
            letter-spacing: 1px;
        }
        .card h3 {
            font-size: 1.1rem;
            color: var(--steel);
            margin: 16px 0 8px;
            padding-left: 8px;
            border-left: 3px solid var(--navy);
        }
        .card h4 {
            font-size: 1rem;
            color: var(--navy);
            margin: 10px 0 6px;
        }

        /* 侧边栏卡片 */
        .side-card {
            background: var(--white);
            border-radius: var(--card-radius);
            box-shadow: var(--shadow);
            padding: 16px 18px;
            margin-bottom: 14px;
            border-left: 4px solid var(--navy);
        }
        .side-card h3 {
            font-size: 1rem;
            color: var(--navy);
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        .side-card .fact-item {
            font-size: 0.85rem;
            color: var(--text-light);
            margin-bottom: 8px;
            padding: 6px 10px;
            background: #f8fafe;
            border-radius: 6px;
            line-height: 1.5;
        }

        /* ========== 信息表格 ========== */
        .info-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            margin-top: 8px;
        }
        .info-table th,
        .info-table td {
            padding: 8px 12px;
            border: 1px solid #e0e6ed;
            text-align: left;
            vertical-align: top;
        }
        .info-table th {
            background: var(--ice);
            color: var(--navy);
            font-weight: 600;
            width: 120px;
            white-space: nowrap;
        }
        .info-table td {
            color: #444;
        }        /* 剧集表格 */
        .ep-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        .ep-table th,
        .ep-table td {
            padding: 6px 8px;
            border: 1px solid #dce3ea;
            text-align: center;
            vertical-align: top;
        }
        .ep-table th {
            background: var(--navy);
            color: #fff;
            font-weight: 500;
        }
        .ep-table tr:nth-child(even) {
            background: #f6f9fc;
        }
        .ep-table tr:hover {
            background: #e8f0fa;
        }
        .highlight-debut {
            background: #fffde7 !important;
            font-weight: 600;
        }

        /* ========== 角色信息卡片 ========== */
        .character-section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f9fbfd;
            border-radius: 10px;
            border: 1px solid #e0e8f0;
        }
        .character-section h3 {
            color: var(--navy);
            font-size: 1.25rem;
            margin-bottom: 12px;
        }
        .character-section h4 {
            color: var(--steel);
            font-size: 1.05rem;
            margin: 16px 0 8px;
        }
        .school-header {
            font-size: 1.5rem;
            color: var(--navy);
            border-bottom: 3px solid var(--gold);
            padding-bottom: 8px;
            margin-top: 30px;
            margin-bottom: 16px;
        }

        /* ========== 雷达图容器 ========== */
        .radar-row {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            margin: 12px 0;
            justify-content: center;
        }
        .radar-box {
            text-align: center;
        }
        .radar-box canvas {
            max-width: 220px;
            max-height: 220px;
        }
        .radar-box .label {
            font-size: 0.85rem;
            color: var(--steel);
            margin-top: 6px;
            font-weight: 600;
        }        /* ========== 按钮 ========== */
        .btn {
            display: inline-block;
            padding: 8px 18px;
            background: var(--navy);
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #0640b8;
        }

        /* ========== 面包屑 ========== */
        .breadcrumb {
            font-size: 0.85rem;
            color: #6a7a8a;
            margin-bottom: 12px;
        }
        .breadcrumb a {
            color: var(--steel);
            cursor: pointer;
            text-decoration: none;
        }
        .breadcrumb a:hover {
            text-decoration: underline;
        }

        /* 排行榜表格 */
        .rank-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        .rank-table th,
        .rank-table td {
            padding: 6px 10px;
            border: 1px solid #dce3ea;
            text-align: center;
        }
        .rank-table th {
            background: var(--navy);
            color: #fff;
            font-weight: 500;
        }
        .rank-table tr:nth-child(even) {
            background: #f6f9fc;
        }
        .rank-table tr:hover {
            background: #e8f0fa;
        }

        /* 响应式 */
        @media (max-width: 900px) {
            .main-wrapper {
                flex-direction: column;
                padding: 10px;
            }
            .sidebar {
                width: 100%;
                position: static;
                max-height: none;
            }
            .top-bar-inner {
                flex-direction: column;
                height: auto;
                padding: 10px 0;
                gap: 6px;
            }
            .nav-links {
                justify-content: center;
            }
            .radar-row {
                justify-content: center;
            }
        }

        /* 页面切换 */
        .page {
            display: none;
        }
        .page.active {
            display: block;
        }

        /* 音乐表格 */
        .music-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        .music-table th,
        .music-table td {
            padding: 6px 8px;
            border: 1px solid #dce3ea;
            text-align: center;
        }
        .music-table th {
            background: var(--navy);
            color: #fff;
            font-weight: 500;
        }
        .music-table tr:nth-child(even) {
            background: #f6f9fc;
        }
        audio {
            width: 160px;
            height: 28px;
        }

        /* 角色图片 */
        .char-img {
            max-width: 200px;
            max-height: 280px;
            border-radius: 8px;
            border: 2px solid var(--ice);
            margin: 8px 12px 8px 0;
            object-fit: cover;
        }
        .char-img-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 10px 0;
        }
    </style>
</head>

        // ==================== 雷达图绘制 ====================
        function drawRadar(canvas, labels, values, sides, color) {
            const ctx = canvas.getContext('2d');
            const w = canvas.width, h = canvas.height;
            const cx = w / 2, cy = h / 2;
            const r = Math.min(cx, cy) - 25;
            ctx.clearRect(0, 0, w, h);
            ctx.strokeStyle = '#d0dae6'; ctx.fillStyle = 'rgba(193,232,255,0.2)';
            for (let level = 1; level <= 4; level++) {
                ctx.beginPath();
                for (let i = 0; i < sides; i++) {
                    const angle = (Math.PI * 2 * i) / sides - Math.PI / 2;
                    const rr = (r * level) / 4;
                    const x = cx + rr * Math.cos(angle), y = cy + rr * Math.sin(angle);
                    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                }
                ctx.closePath(); if (level === 4) ctx.fill(); ctx.stroke();
            }
            ctx.strokeStyle = '#a0b8cc';
            for (let i = 0; i < sides; i++) {
                const angle = (Math.PI * 2 * i) / sides - Math.PI / 2;
                ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + r * Math.cos(angle), cy + r * Math.sin(angle)); ctx.stroke();
            }
            ctx.fillStyle = '#333'; ctx.font = '10px PingFang SC, Microsoft YaHei, sans-serif'; ctx.textAlign = 'center';
            for (let i = 0; i < sides; i++) {
                const angle = (Math.PI * 2 * i) / sides - Math.PI / 2;
                ctx.fillText(labels[i], cx + (r + 16) * Math.cos(angle), cy + (r + 16) * Math.sin(angle));
            }
            ctx.fillStyle = color + '55'; ctx.strokeStyle = color; ctx.lineWidth = 2;
            ctx.beginPath();
            for (let i = 0; i < sides; i++) {
                const angle = (Math.PI * 2 * i) / sides - Math.PI / 2;
                const v = Math.min(1, values[i]);
                const x = cx + r * v * Math.cos(angle), y = cy + r * v * Math.sin(angle);
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.closePath(); ctx.fill(); ctx.stroke();
        }

            html += '<div class="card"><h2>📊 角色能力排行</h2><p>基于体能数据和五维数值的角色能力排行。</p><a class="btn" onclick="navigateTo(\'rankings\')">查看排行 →</a></div>';

        }        // ==================== 角色页 ====================
        function renderCharacterBlock(name) {
            const c = charactersData[name];
            if (!c) return '';
            let html = `<div class="character-section" id="char-${name.replace(/[^a-zA-Z\u4e00-\u9fa5]/g,'')}">`;
            html += `<h3>${c.section} ${name}</h3>`;
            if (c.images && c.images.length > 0) {
                html += '<div class="char-img-row">';
                c.images.forEach(img => { html += `<img src="${img}" alt="${name}" class="char-img" onerror="this.style.display='none'">`; });
                html += '</div>';
            }
            html += '<h4>📋 基本信息</h4><table class="info-table">';
            c.basic.forEach(b => { html += `<tr><th>${b[0]}</th><td>${b[1]}</td></tr>`; });
            html += '</table>';
            if (c.appearance) html += `<p style="margin-top:8px;"><strong>着装外貌：</strong>${c.appearance}</p>`;
            if (c.personality) html += `<p><strong>性格特征：</strong>${c.personality}</p>`;
            html += '<h4>🎾 网球能力</h4>';
            if (c.ability) html += `<p><strong>打球类型：</strong>${c.ability}</p>`;
            html += '<div class="radar-row">';
            const idSuffix = name.replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g,'');
            if (c.physical) html += `<div class="radar-box"><canvas id="radar-phy-${idSuffix}" width="220" height="220"></canvas><div class="label">体能数据</div></div>`;
            if (c.fiveD) html += `<div class="radar-box"><canvas id="radar-five-${idSuffix}" width="220" height="220"></canvas><div class="label">五维数值${c.fiveD_note||''}</div></div>`;
            html += '</div>';
            if (c.skills && c.skills.length > 0) {
                html += '<table class="info-table" style="margin-top:10px;"><tr><th>技能名称</th><th>技能介绍</th></tr>';
                c.skills.forEach(s => { html += `<tr><td>${s[0]}</td><td>${s[1]}</td></tr>`; });
                html += '</table>';
            }
            html += '<h4>🍵 角色生活</h4><table class="info-table">';
            c.life.forEach(l => { html += `<tr><th>${l[0]}</th><td>${l[1]}</td></tr>`; });
            html += '</table>';
            if (c.quotes && c.quotes.length > 0) {
                html += '<h4>💬 口头禅</h4><ul style="padding-left:20px;">';
                c.quotes.forEach(q => { html += `<li style="margin:6px 0;color:#444;">${q}</li>`; });
                html += '</ul>';
            }
            if (c.evaluation && c.evaluation.length > 0) {
                html += '<h4>⭐ 角色评价</h4><table class="info-table">';
                c.evaluation.forEach(e => { html += `<tr><th>${e[0]}</th><td>${e[1]}</td></tr>`; });
                html += '</table>';
            }
            if (c.record && c.record.length > 1) {
                html += '<h4>⚔️ 对战记录</h4><div style="overflow-x:auto;"><table class="ep-table"><thead><tr>';
                c.record[0].forEach(h => { html += `<th>${h}</th>`; });
                html += '</tr></thead><tbody>';
                for (let i = 1; i < c.record.length; i++) {
                    html += '<tr>';
                    c.record[i].forEach(d => { html += `<td>${d}</td>`; });
                    html += '</tr>';
                }
                html += '</tbody></table></div>';
            }
            html += '</div>';
            return html;
        }

        function renderCharacters() {

                { id: 'seigaku', name: '🏫 1.1 青春学园', chars: ['越前龙马','手冢国光','不二周助','大石秀一郎','菊丸英二','乾贞治','河村隆','海堂薰','桃城武','龙崎堇'] },
                { id: 'hyotei', name: '🏫 1.2 冰帝学园', chars: ['迹部景吾','忍足侑士','桦地崇弘','日吉若','凤长太郎','宍户亮','芥川慈郎','向日岳人','榊太郎'] },

        function drawAllRadars() {
            for (const [name, c] of Object.entries(charactersData)) {
                const idSuffix = name.replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g,'');
                const canvasPhy = document.getElementById('radar-phy-' + idSuffix);
                const canvasFive = document.getElementById('radar-five-' + idSuffix);
                if (canvasPhy && c.physical) {
                    const normPhy = normalizePhysical(c.physical);
                    const labels10 = ['左右侧跳','20M渐速','背肌力','握力','俯卧弓身','坐姿体前弯','50米跑','立定跳远','垒球掷远','耐力跑'];
                    const keys10 = ['左右侧跳(次)','20M渐速来回跑(次)','背肌力(KG)','握力(KG)左','俯卧弓身(CM)','坐姿体前弯(CM)','50米跑步(秒)','立定跳远(CM)','垒球掷远(M)','耐力跑(1500米)'];
                    drawRadar(canvasPhy, labels10, keys10.map(k => normPhy[k] !== undefined ? normPhy[k] : (normPhy[k.replace('左','右')] || 0)), 10, '#052695');
                }
                if (canvasFive && c.fiveD) {
                    const normFive = normalizeFiveD(c.fiveD);
                    const labels5 = ['速度','力量','体力','技术','精神力'];
                    drawRadar(canvasFive, labels5, labels5.map(k => normFive[k]), 5, '#5483B3');
                }
            }
        }        // ==================== 漫画页 ====================
        function renderManga() {
            const container = document.getElementById('contentContainer');
            let html = '<div class="breadcrumb"><a onclick="navigateTo(\'home\')">首页</a> › 原作漫画</div>';

            publishData.forEach(p => { html += `<tr><td>第${p.vol}卷</td><td>${p.title}</td><td>${p.shueisha}</td><td>${p.seibun}</td><td>${p.lhh}</td></tr>`; });

        // ==================== TV动画页 ====================
        function renderAnime() {
            const container = document.getElementById('contentContainer');
            let html = '<div class="breadcrumb"><a onclick="navigateTo(\'home\')">首页</a> › TV动画</div>';
            html += '<div class="card"><h2>📺 TV动画</h2><p>于<strong>2001年10月10日</strong>在东京电视台开播，共<strong>178集</strong>，每集约22分钟。导演滨名孝行，动画制作TRANS ARTS。</p></div>';
            html += '<div class="card"><h2>📋 完整剧集列表（共178集）</h2><p style="color:#888;margin-bottom:10px;">黄色标注行表示重要人物登场。</p><div style="overflow-x:auto;"><table class="ep-table"><thead><tr><th>话数</th><th>中文标题</th><th>日文标题</th><th>重要事项</th></tr></thead><tbody>';
            animeEpisodes.forEach(ep => {
                const highlight = ep.debut ? ' highlight-debut' : '';

        // ==================== 音乐页 ====================
        function renderMusic() {
            const container = document.getElementById('contentContainer');
            let html = '<div class="breadcrumb"><a onclick="navigateTo(\'home\')">首页</a> › 音乐汇总</div>';
            html += '<div class="card"><h2>🎵 音乐汇总</h2><p>收录TV动画的片头曲（OP）和片尾曲（ED）。点击播放按钮试听（需将MP3文件放入<code>music/</code>文件夹）。</p></div>';

        // ==================== 能力排行页 ====================
        function renderRankings() {
            const container = document.getElementById('contentContainer');
            let html = '<div class="breadcrumb"><a onclick="navigateTo(\'home\')">首页</a> › 角色能力排行</div>';
            html += '<div class="card"><h2>📊 角色能力排行</h2><p>基于各角色的体能数据和五维数值进行排名。</p></div>';

            const allPhysical = [], allFiveD = [];
            for (const [name, c] of Object.entries(charactersData)) {
                if (c.physical) {
                    const p = c.physical;
                    const run1500 = typeof p['耐力跑(1500米)'] === 'object' ? p['耐力跑(1500米)'].value : (p['耐力跑(1500米)'] || 0);
                    const gripVal = p['握力(KG)左'] || p['握力(KG)右'] || 0;
                    allPhysical.push({name, school:c.school, sideJump:p['左右侧跳(次)']||0, shuttleRun:p['20M渐速来回跑(次)']||0, backStrength:p['背肌力(KG)']||0, grip:gripVal, bow:p['俯卧弓身(CM)']||0, sitReach:p['坐姿体前弯(CM)']||0, sprint50:p['50米跑步(秒)']||0, longJump:p['立定跳远(CM)']||0, throw:p['垒球掷远(M)']||0, run1500});
                }
                if (c.fiveD) {
                    allFiveD.push({name, school:c.school, speed:c.fiveD['速度']||0, power:c.fiveD['力量']||0, stamina:c.fiveD['体力']||0, tech:c.fiveD['技术']||0, mental:c.fiveD['精神力']||0, total:c.fiveD['总和']||0});
                }
            }

            html += '<div class="card"><h2>🏃 体能数据排行</h2><div style="overflow-x:auto;"><table class="rank-table"><thead><tr><th>角色</th><th>学校</th><th>左右侧跳</th><th>20M渐速跑</th><th>背肌力</th><th>握力</th><th>俯卧弓身</th><th>坐姿体前弯</th><th>50米跑</th><th>立定跳远</th><th>垒球掷远</th><th>耐力跑</th></tr></thead><tbody>';
            allPhysical.forEach(p => { html += `<tr><td>${p.name}</td><td>${p.school}</td><td>${p.sideJump}</td><td>${p.shuttleRun}</td><td>${p.backStrength}</td><td>${p.grip}</td><td>${p.bow}</td><td>${p.sitReach}</td><td>${p.sprint50}秒</td><td>${p.longJump}</td><td>${p.throw}</td><td>${Math.floor(p.run1500/60)}分${p.run1500%60}秒</td></tr>`; });
            html += '</tbody></table></div></div>';

            allFiveD.sort((a,b) => b.total - a.total);
            html += '<div class="card"><h2>⭐ 五维数值排行</h2><div style="overflow-x:auto;"><table class="rank-table"><thead><tr><th>排名</th><th>角色</th><th>学校</th><th>速度</th><th>力量</th><th>体力</th><th>技术</th><th>精神力</th><th>总和</th></tr></thead><tbody>';
            allFiveD.forEach((f, idx) => { html += `<tr><td><strong>#${idx+1}</strong></td><td>${f.name}</td><td>${f.school}</td><td>${f.speed}</td><td>${f.power}</td><td>${f.stamina}</td><td>${f.tech}</td><td>${f.mental}</td><td><strong>${f.total}</strong></td></tr>`; });
            html += '</tbody></table></div></div>';
            container.innerHTML = html;
        }        // ==================== 初始化 ====================
        function init() { navigateTo('home'); }
        init();
    </script>
